<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        /* This makes the button look neat and clickable */
        summary {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            user-select: none;
        }

        summary:hover {
            background-color: #0056b3;
        }

        /* Turns the gallery container into a side-by-side flex layout */
        .image-gallery {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            display: flex;
            flex-wrap: wrap; /* Allows images to drop to the next line when out of room */
            gap: 15px;       /* Adds a clean space between the images */
            justify-content: center; /* Centers the row of images */
        }

        /* FIX: This keeps the images small but prevents them from being cropped */
        .gallery-img {
            max-width: 200px;   /* Limits the maximum width */
            max-height: 200px;  /* Limits the maximum height */
            width: auto;        /* Lets the width adjust naturally */
            height: auto;       /* Lets the height adjust naturally */
            object-fit: contain; /* Scales the image down without cropping anything */
            border-radius: 4px;
            border: 1px solid #eee; /* Optional: adds a thin border around each image frame */
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>have you seen this man.</p>
    
    <!-- Image 1: Your main visible image -->
    <img src="avatar.png" alt="Wanted poster description" style="max-width: 100%; height: auto;">

    <!-- The expandable button section for the remaining images -->
    <details>
        <summary>Click to see more images</summary>
        <div class="image-gallery">
            
            <img class="gallery-img" src="IMG_0134.PNG" alt="first view">
            <img class="gallery-img" src="IMG_0157.PNG" alt="Second view">
            <img class="gallery-img" src="IMG_0182.PNG" alt="Third view">
            <img class="gallery-img" src="IMG_0185.PNG" alt="Fourth view">
            <img class="gallery-img" src="IMG_0206.PNG" alt="Fifth view">
            <img class="gallery-img" src="IMG_0215.PNG" alt="Sixth view">
            <img class="gallery-img" src="IMG_0217.PNG" alt="Seventh view">
            <img class="gallery-img" src="IMG_0218.PNG" alt="Eighth view">
            
        </div>
    </details>

</body>
</html>
