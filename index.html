<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* This styles the main button layout */
        .secure-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            user-select: none;
        }

        .secure-btn:hover {
            background-color: #0056b3;
        }

        /* Turns the gallery container into a side-by-side flex layout */
        .image-gallery {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            display: flex;
            flex-wrap: wrap; 
            gap: 15px;       
            justify-content: center; 
        }

        /* Fixed size so they sit nicely next to each other */
        .gallery-img {
            max-width: 200px;   
            max-height: 200px;  
            width: auto;        
            height: auto;       
            object-fit: contain; 
            border-radius: 4px;
            border: 1px solid #eee;
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .gallery-img:hover {
            transform: scale(1.05); 
        }

        /* --- WEBSITE PASSWORD POPUP OVERLAY --- */
        .pwd-modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Dark transparent tint */
        }

        .pwd-modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .pwd-modal-content h3 {
            margin-top: 0;
            color: #333;
        }

        .pwd-input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }

        .pwd-submit-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .pwd-submit-btn:hover {
            background-color: #218838;
        }

        .close-pwd {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }

        .close-pwd:hover {
            color: #333;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* --- LIGHTBOX SLIDESHOW STYLING --- */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9); 
        }

        .lightbox-content {
            margin: auto;
            display: block;
            max-width: 85%;
            max-height: 75vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -50px;
            color: white;
            font-weight: bold;
            font-size: 40px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .prev {
            left: 0;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <h1>Hello, World!</h1>
    <p>have you seen this man.</p>
    
    <!-- Image 1: Your main visible image -->
    <img src="avatar.png" alt="Wanted poster description" style="max-width: 100%; height: auto;">

    <div>
        <button class="secure-btn" onclick="openPasswordModal()">Click to see more images</button>
        
        <!-- The gallery hidden until unlocked -->
        <div id="secureGallery" class="image-gallery" style="display: none;">
            <img class="gallery-img" src="IMG_0134.PNG" alt="first view" data-index="0">
            <img class="gallery-img" src="IMG_0157.PNG" alt="Second view" data-index="1">
            <img class="gallery-img" src="IMG_0182.PNG" alt="Third view" data-index="2">
            <img class="gallery-img" src="IMG_0185.PNG" alt="Fourth view" data-index="3">
            <img class="gallery-img" src="IMG_0206.PNG" alt="Fifth view" data-index="4">
            <img class="gallery-img" src="IMG_0215.PNG" alt="Sixth view" data-index="5">
            <img class="gallery-img" src="IMG_0217.PNG" alt="Seventh view" data-index="6">
            <img class="gallery-img" src="IMG_0218.PNG" alt="Eighth view" data-index="7">
        </div>
    </div>

    <!-- NEW: Directly built password display frame -->
    <div id="pwdModal" class="pwd-modal">
        <div class="pwd-modal-content">
            <span class="close-pwd" onclick="closePasswordModal()">&times;</span>
            <h3>Enter Password</h3>
            <p style="color: #666; font-size: 14px; margin: 0;">This section is restricted.</p>
            <input type="password" id="passwordField" class="pwd-input" placeholder="Password">
            <br>
            <button class="pwd-submit-btn" onclick="verifyPassword()">Submit</button>
            <div id="errorMsg" class="error-msg">Incorrect password. Try again!</div>
        </div>
    </div>

    <!-- The Pop-up Lightbox Structure -->
    <div id="myLightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightboxImg">
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
    </div>

    <script>
        const pwdModal = document.getElementById('pwdModal');
        const passwordField = document.getElementById('passwordField');
        const errorMsg = document.getElementById('errorMsg');
        const gallery = document.getElementById('secureGallery');

        // CUSTOM PASSWORD MODAL LOGIC
        function openPasswordModal() {
            // If it's already open, clicking the main button hides it
            if (gallery.style.display === "flex") {
                gallery.style.display = "none";
                return;
            }
            // Otherwise open password display box
            pwdModal.style.display = "block";
            passwordField.value = ""; // Clear old entry
            errorMsg.style.display = "none"; // Clear old errors
            passwordField.focus();
        }

        function closePasswordModal() {
            pwdModal.style.display = "none";
        }

        function verifyPassword() {
            if (passwordField.value === "JAGM") {
                gallery.style.display = "flex"; // Unlocks the gallery layout
                closePasswordModal();
            } else {
                errorMsg.style.display = "block"; // Shows wrong password error text directly in the box
            }
        }

        // Allow hitting the "Enter" key inside input to submit password
        passwordField.addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        });

        // LIGHTBOX SLIDESHOW LOGIC
        let currentIdx = 0;
        const images = document.querySelectorAll('.gallery-img');
        const lightbox = document.getElementById('myLightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        images.forEach((img) => {
            img.addEventListener('click', function() {
                openLightbox(parseInt(this.getAttribute('data-index')));
            });
        });

        function openLightbox(index) {
            currentIdx = index;
            lightbox.style.display = "block";
            updateLightboxImage();
        }

        function closeLightbox() {
            lightbox.style.display = "none";
        }

        function changeSlide(direction) {
            currentIdx += direction;
            if (currentIdx >= images.length) currentIdx = 0;
            if (currentIdx < 0) currentIdx = images.length - 1;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            lightboxImg.src = images[currentIdx].src;
        }

        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (lightbox.style.display === "block") {
                if (e.key === "ArrowLeft") changeSlide(-1);
                if (e.key === "ArrowRight") changeSlide(1);
                if (e.key === "Escape") closeLightbox();
