<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        /* This makes the button look neat and clickable */
        summary {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            user-select: none;
        }

        summary:hover {
            background-color: #0056b3;
        }

        /* This styles the hidden content area once it opens */
        .image-gallery {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        .gallery-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>have you seen this man.</p>
    
    <!-- Image 1: Your main visible image -->
    <img src="avatar.png" alt="Wanted poster description" style="max-width: 100%; height: auto;">

    <!-- The expandable button section for the remaining 7 images -->
    <details>
        <summary>Click to see more images</summary>
        <div class="image-gallery">
            
            <!-- Replace these filler names with the exact names of your uploaded files -->
            <img class="gallery-img" src="IMG_0134.PNG" alt="first view">
            <img class="gallery-img" src="IMG_0157.PNG" alt="Second view">
            <img class="gallery-img" src="IMG_0182.PNG" alt="Third view">
            <img class="gallery-img" src="IMG_0185.PNG" alt="Fourth view">
            <img class="gallery-img" src="IMG_0206.PNG" alt="Fifth view">
            <img class="gallery-img" src="IMG_0215.PNG" alt="Sixth view">
            <img class="gallery-img" src="IMG_0217.PNG" alt="Seventh view">
            <img class="gallery-img" src="IMG_0218.PNG" alt="Eighth view">
            
        </div>
    </details>

</body>
</html>
