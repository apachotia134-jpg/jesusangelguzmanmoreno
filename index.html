<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGM Gallery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom image styling */
        .gallery-img {
            max-width: 200px;   
            max-height: 200px;  
            width: auto;        
            height: auto;       
            object-fit: contain; 
            border-radius: 4px;
            border: 1px solid #eee;
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .gallery-img:hover {
            transform: scale(1.05); 
        }

        /* Lightbox transitions */
        .lightbox-content {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
        }
    </style>
</head>

            </div>

                <button onclick="openPasswordModal()" class="w-full sm:w-auto bg-[#a0dce4] hover:bg-[#0056b3] text-white font-bold py-3 px-6 rounded-xl shadow transition duration-200 min-h-[48px] text-base">

                </button>
